name: Build Windows App

on:
  workflow_dispatch: {}

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Kunin ang code
        uses: actions/checkout@v4

      - name: I-setup ang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: I-install ang dependencies
        run: npm install

      - name: I-build ang installer (.exe)
        run: npm run dist:win

      - name: I-upload ang installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Soundboard-Windows-Installer
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
